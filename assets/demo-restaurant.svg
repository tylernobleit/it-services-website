<svg viewBox="0 0 600 430" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Demo: restaurant website">
  <defs>
    <linearGradient id="rHero" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a3522"/><stop offset="1" stop-color="#2a1a12"/></linearGradient>
  </defs>
  <rect width="600" height="430" rx="8" fill="#fbf6ee"/>
  <rect width="600" height="30" fill="#e7eaef"/>
  <circle cx="18" cy="15" r="4.5" fill="#ff5f57"/><circle cx="34" cy="15" r="4.5" fill="#febc2e"/><circle cx="50" cy="15" r="4.5" fill="#28c840"/>
  <rect x="70" y="8" width="500" height="14" rx="7" fill="#ffffff"/>
  <text x="80" y="18" font-size="8" fill="#9aa4b2" font-family="Arial, sans-serif">trattoriabella.com</text>
  <!-- hero with overlay -->
  <rect x="0" y="30" width="600" height="200" fill="url(#rHero)"/>
  <circle cx="120" cy="120" r="80" fill="#7a4a2e" opacity="0.25"/><circle cx="480" cy="180" r="100" fill="#7a4a2e" opacity="0.2"/>
  <text x="300" y="62" font-size="9" fill="#e8c07a" text-anchor="middle" letter-spacing="4" font-family="Arial, sans-serif">EST. 1998 · CLEARWATER</text>
  <text x="300" y="84" font-size="20" fill="#f3e3c6" text-anchor="middle" font-style="italic">Trattoria Bella</text>
  <text x="300" y="138" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Authentic Italian,</text>
  <text x="300" y="172" font-size="30" font-weight="700" fill="#e8b96a" text-anchor="middle">Made Fresh Daily</text>
  <rect x="232" y="190" width="136" height="32" rx="16" fill="#e8b96a"/><text x="300" y="211" font-size="12" font-weight="700" fill="#2a1a12" text-anchor="middle" font-family="Arial, sans-serif">Reserve a Table</text>
  <!-- menu -->
  <text x="300" y="262" font-size="16" font-weight="700" fill="#5a3522" text-anchor="middle">From Our Kitchen</text>
  <line x1="270" y1="270" x2="330" y2="270" stroke="#e8b96a" stroke-width="2"/>
  <g font-family="Georgia, serif">
    <text x="44" y="300" font-size="12" font-weight="700" fill="#2a1a12">Margherita Pizza</text>
    <text x="556" y="300" font-size="12" font-weight="700" fill="#a8642f" text-anchor="end">$16</text>
    <text x="44" y="316" font-size="9" fill="#8a7560" font-family="Arial, sans-serif">San Marzano, fresh mozzarella, basil</text>
    <line x1="44" y1="328" x2="556" y2="328" stroke="#ece0cd"/>
    <text x="44" y="350" font-size="12" font-weight="700" fill="#2a1a12">Spaghetti Carbonara</text>
    <text x="556" y="350" font-size="12" font-weight="700" fill="#a8642f" text-anchor="end">$19</text>
    <text x="44" y="366" font-size="9" fill="#8a7560" font-family="Arial, sans-serif">Pancetta, egg, pecorino, black pepper</text>
    <line x1="44" y1="378" x2="556" y2="378" stroke="#ece0cd"/>
    <text x="44" y="400" font-size="12" font-weight="700" fill="#2a1a12">Osso Buco</text>
    <text x="556" y="400" font-size="12" font-weight="700" fill="#a8642f" text-anchor="end">$28</text>
    <text x="44" y="416" font-size="9" fill="#8a7560" font-family="Arial, sans-serif">Braised veal shank, saffron risotto</text>
